<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internsight Filter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/filter.css">
  <script src="js/components.js" defer></script>
  <script src="js/filter.js" defer></script>
  <script src="js/navbar.js" defer></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div id="app-navbar"></div>

  <main>
    <div class="crumb">
      <a href="home.html" class="back" aria-label="ย้อนกลับ"><i data-lucide="arrow-left"></i></a>
    </div>

    <div class="layout">
      <aside class="left-bar">
        <h2><i data-lucide="filter"></i>ตัวกรองค้นหา</h2>
        <div class="grp">
          <h3>เรียงตาม</h3>
          <select class="sel" id="sortSelect" aria-label="เรียงตาม">
            <option value="latest">รีวิวล่าสุด</option>
            <option value="oldest">รีวิวที่เก่าที่สุด</option>
            <option value="likes">รีวิวที่มียอดไลค์สูงสุด</option>
            <option value="rating">รีวิวที่มีคะแนนสูงสุด</option>
          </select>
        </div>

        <div class="grp">
          <h3>ค้นหาบริษัทและตำแหน่งงาน</h3>
          <label class="lbl" for="company">ชื่อบริษัท</label>
          <div class="company-wrap">
            <div class="field-icon">
              <i data-lucide="search"></i>
              <input id="company" placeholder="พิมพ์ชื่อบริษัท เช่น AAAA, KB">
            </div>
            <div id="companySuggestions"></div>
          </div>
      
          <div class="row2">
            <div><label class="lbl" for="ctype">ประเภทของบริษัท</label>
              <select class="sel" id="ctype">
                <option>ทั้งหมด</option>
              </select></div>
            <div><label class="lbl" for="role">ตำแหน่งงาน</label>
              <select class="sel" id="role">
                <option>ทั้งหมด</option>
              </select></div>
          </div>
        </div>

        <div class="grp">
          <h3>รูปแบบการทำงาน</h3>
          <div class="pills">
            <label><input type="radio" name="mode" checked><span>ทั้งหมด</span></label>
            <label><input type="radio" name="mode"><span>On-site</span></label>
            <label><input type="radio" name="mode"><span>Remote</span></label>
            <label><input type="radio" name="mode"><span>Hybrid</span></label>
          </div>
        </div>

        <div class="grp">
          <h3>ค่าตอบแทนต่อวัน</h3>
          <div class="pills">
            <label><input type="radio" name="pay" checked><span>ทั้งหมด</span></label>
            <label><input type="radio" name="pay"><span>ไม่มีเบี้ยเลี้ยง</span></label>
            <label><input type="radio" name="pay"><span>300-500 ฿</span></label>
            <label><input type="radio" name="pay"><span>501-800 ฿</span></label>
            <label><input type="radio" name="pay"><span>801+ ฿</span></label>
          </div>
        </div>

        <div class="grp">
          <h3>ทักษะ</h3>
          <div class="skill-wrap">
            <div class="field-icon"><i data-lucide="search"></i><input id="skillInput" placeholder="พิมพ์ค้นหาทักษะ เช่น Python Java" aria-label="ทักษะ"></div>
            <div id="skillSuggestions" class="suggestions"></div>
            <div id="skillTags" class="tags"></div>
          </div>
        </div>

        <button class="btn primary" id="applyFilterBtn">นำตัวกรองไปใช้</button>
        <button class="btn ghost" id="resetFilterBtn">ล้างค่าตัวกรอง</button>
      </aside>


      <section class="right-bar">
        <div class="cards-grid" id="cardGrid"></div>

        <nav class="pager" aria-label="เลือกหน้า">
          <button class="nav" id="prevBtn" type="button">
            <i data-lucide="arrow-left"></i>ย้อนกลับ
          </button>
          
          <div class="nums" id="pageNumbers"></div>

          <button class="nav" id="nextBtn" type="button">
            ถัดไป<i data-lucide="arrow-right"></i>
          </button>
        </nav>
      </section>
    </div>
  </main>

  <a href="post-review.html" class="fab" aria-label="เขียนรีวิว" title="เขียนรีวิว">
    <img class="write-review-icon" src="images/icon-pencil.png" alt="">
  </a>

</body>
</html>
