<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internsight User</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/user.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/components.js" defer></script>
  <script src="js/user.js" defer></script>
  <script src="js/navbar.js" defer></script>
</head>
<body>

<div id="app-navbar"></div>

<main>

  <section class="profile">
    <span class="big"><i data-lucide="user-round" class="lg"></i></span>
    <h1 id="profileName">โปรไฟล์ของฉัน</h1>
    <a href="setting.html" class="btn-sm push"><i data-lucide="settings"></i>แก้ไขโปรไฟล์</a>
  </section>

  <section class="banner">
    <span class="ico"><i data-lucide="heart"></i></span>
    <p>มีประสบการณ์ฝึกงานล่าสุดอยากแบ่งปันมั้ย ?</p>
    <a href="post-review.html" class="btn-dark push" style="text-decoration:none;"><i data-lucide="square-pen"></i>เขียนรีวิว</a>
  </section>

  <div class="list-head">
    <h2><i data-lucide="pin" class="solid"></i>รีวิวของฉันทั้งหมด <span id="reviewCount"></span></h2>
    <label>เรียงตาม :
      <select id="reviewOrder" class="sel" aria-label="เรียงตาม"><option value="newest">รีวิวล่าสุด</option><option value="oldest">รีวิวที่เก่าที่สุด</option></select>
    </label>
  </div>

  <p id="reviewStatus" role="status">กำลังโหลดรีวิว…</p>
  <div class="cards-grid" id="myReviews"></div>
  <dialog id="deleteReview" aria-labelledby="deleteTitle">
    <strong id="deleteIcon" aria-hidden="true">!</strong>
    <h2 id="deleteTitle">ลบรีวิวนี้หรือไม่?</h2>
    <p id="deleteMessage"></p>
    <button id="cancelDelete" class="btn-sm" autofocus>ยกเลิก</button>
    <button id="confirmDelete" class="btn-dark">ลบรีวิว</button>
  </dialog>
</main>

<a href="post-review.html" class="fab" aria-label="เขียนรีวิว" title="เขียนรีวิว" style="text-decoration:none;"><img class="write-review-icon" src="images/icon-pencil.png" alt=""></a>

</body>
</html>
