<!doctype html>
<html lang="th">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>เข้าสู่ระบบ | Internsight</title>
		<link rel="stylesheet" href="login.css" />
		<script src="login.js" defer></script>
	</head>
	<body>
		<!-- SVG icons ใช้ภายในไฟล์ ไม่ต้องติดตั้ง library -->
		<svg
			class="icon-definitions"
			xmlns="http://www.w3.org/2000/svg"
			aria-hidden="true"
		>
			<symbol id="logo" viewBox="0 0 32 32">
				<path d="M12 29H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h20a3 3 0 0 1 3 3v7" />
				<circle cx="18" cy="18" r="7" />
				<path d="m23 23 7 7" />
			</symbol>
			<symbol id="eye" viewBox="0 0 24 24">
				<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
				<circle cx="12" cy="12" r="3" />
			</symbol>
			<symbol id="cap" viewBox="0 0 28 28">
				<path d="m2 10 12-6 12 6-12 6Z M7 13v7c4 3 10 3 14 0v-7 M2 10v10" />
			</symbol>
			<symbol id="arrow" viewBox="0 0 24 24">
				<path d="M4 12h15m-6-6 6 6-6 6" />
			</symbol>
		</svg>

		<header class="site-header">
			<span class="brand">
				<svg class="icon brand-icon"><use href="#logo" /></svg>
				<span>Internsight</span>
			</span>
		</header>

		<main class="notebook">
			<section class="intro-page" aria-labelledby="intro-heading">
				<span class="top-tape" aria-hidden="true"></span>
				<div class="ruled-paper" aria-hidden="true"></div>
				<h1 id="intro-heading">
					เรื่องราวฝึกงาน
					<br />
					เริ่มต้นที่นี่
				</h1>
				<p class="intro-caption">
					อ่านประสบการณ์รุ่นพี่ แล้วแบ่งปันเรื่องราวของเรา
				</p>
				<div class="notes" aria-hidden="true">
					<div class="note note-left"><span></span></div>
					<div class="note note-right"><span></span></div>
					<div class="note note-front"><span></span></div>
				</div>
			</section>

			<div class="binding" aria-hidden="true">
				<span></span>
				<span></span>
				<span></span>
			</div>

			<section class="login-page" aria-labelledby="login-heading">
				<div class="login-content">
					<h2 id="login-heading">เข้าสู่ระบบ</h2>
					<p class="welcome">ยินดีต้อนรับสู่ InternSight</p>

					<form id="login-form">
						<div class="field">
							<label for="student-id">รหัสนักศึกษา</label>
							<input
								id="student-id"
								name="studentId"
								type="text"
								inputmode="numeric"
								autocomplete="username"
								placeholder="เช่น 67090500400"
								pattern="[0-9]+"
								title="กรอกรหัสนักศึกษาเป็นตัวเลข"
								required
							/>
						</div>
						<div class="field password-field">
							<label for="password">รหัสผ่าน</label>
							<div class="password-wrapper">
								<input
									id="password"
									name="password"
									type="password"
									autocomplete="current-password"
									placeholder="•••••••"
									required
								/>
								<button
									id="toggle-password"
									class="eye-button"
									type="button"
									aria-label="แสดงรหัสผ่าน"
									aria-pressed="false"
									aria-controls="password"
								>
									<svg class="icon">
										<use href="#eye" />
										<path class="eye-slash" d="m3 3 18 18" />
									</svg>
								</button>
							</div>
						</div>
						<div class="forgot-row">
							<button type="button" class="text-button" data-demo="forgot">
								ลืมรหัสผ่าน?
							</button>
						</div>
						<button class="login-button" type="submit">
							เข้าสู่ระบบ
							<svg class="icon"><use href="#arrow" /></svg>
						</button>
					</form>

					<div class="divider"><span>or</span></div>
					<button
						id="kmutt-login"
						class="kmutt-button"
						type="button"
						data-demo="kmutt"
					>
						<svg class="icon"><use href="#cap" /></svg>
						Log in with KMUTT Account
					</button>
					<p class="signup">
						ยังไม่มีบัญชี?
						<a class="text-button" href="register.html">สมัครบัญชี</a>
					</p>
				</div>
			</section>
		</main>

		<!-- กล่องแจ้งสถานะสำหรับตัวอย่าง Frontend เท่านั้น -->
		<dialog id="demo-dialog" aria-labelledby="dialog-title">
			<h2 id="dialog-title">ตัวอย่างการทำงาน</h2>
			<p id="dialog-message"></p>
			<form method="dialog"><button class="login-button">ปิด</button></form>
		</dialog>
	</body>
</html>
