<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลัก | Internsight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/home.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/components.js" defer></script>
    <script src="js/script_home.js" defer></script>
</head>

<body>
    <!-- Shared Top Navbar & Sidebar -->
    <div id="app-navbar"></div>

    <!-- เนื้อหาหลักของหน้าเว็บ -->
    <main class="container">

        <!-- ส่วนหัวข้อหลัก (Hero Section) -->
        <section class="hero-section">
            <div class="hero-text">
                <h2 class="hero-title">
                    ทุกประสบการณ์ฝึกงาน<br>
                    มีเรื่องให้ส่งต่อ
                </h2>
                <div class="page-indicator">
                    <span class="pin">📌</span>
                    <span>หน้าหลัก</span>
                </div>
            </div>

            <!-- กระดาษโน้ต 3 แผ่นฝั่งขวาตาม Mockup -->
            <div class="hero-papers">
                <div class="paper paper-1"></div>
                <div class="paper paper-2"></div>
                <div class="paper paper-3"></div>
            </div>
        </section>

        <!-- โซนการ์ดรีวิวฝึกงาน (ดึงจาก components.js กลาง) -->
        <div class="cards-grid" id="cardsGrid"></div>

    </main>

    <!-- ปุ่มลอยสำหรับกดไปหน้าเขียนรีวิว -->
    <a href="post-review.html" class="fab-write-review" title="เขียนรีวิวฝึกงาน" aria-label="เขียนรีวิวฝึกงาน">
        <i data-lucide="pen-line"></i>
    </a>
</body>

</html>
