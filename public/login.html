<!doctype html>
<html lang="th">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>เข้าสู่ระบบ | Internsight</title>
		<link rel="stylesheet" href="css/login.css" />
		<script src="https://unpkg.com/lucide@latest"></script>
		<script src="js/login.js" defer></script>
	</head>
	<body>
		<header class="site-header">
			<span class="brand">
				<i data-lucide="file-search-2" class="icon brand-icon"></i>
				<span>Internsight</span>
			</span>
		</header>

		<main class="notebook">
			<section class="intro-page" aria-labelledby="intro-heading">
				<span class="top-tape" aria-hidden="true"></span>
				<div class="ruled-paper" aria-hidden="true"></div>
				<h1 id="intro-heading">
					เรื่องราวฝึกงาน
					<br />
					เริ่มต้นที่นี่
				</h1>
				<p class="intro-caption">
					อ่านประสบการณ์รุ่นพี่ แล้วแบ่งปันเรื่องราวของเรา
				</p>
				<div class="notes" aria-hidden="true">
					<div class="note note-left"><span></span></div>
					<div class="note note-right"><span></span></div>
					<div class="note note-front"><span></span></div>
				</div>
			</section>

			<div class="binding" aria-hidden="true">
				<span></span>
				<span></span>
				<span></span>
			</div>

			<section class="login-page" aria-labelledby="login-heading">
				<div class="login-content">
					<h2 id="login-heading">เข้าสู่ระบบ</h2>
					<p class="welcome">ยินดีต้อนรับสู่ InternSight</p>

					<form id="login-form">
						<div class="field">
							<label for="student-id">รหัสนักศึกษา</label>
							<input
								id="student-id"
								name="studentId"
								type="text"
								inputmode="numeric"
								autocomplete="username"
								placeholder="เช่น 67090500400"
								pattern="[0-9]+"
								title="กรอกรหัสนักศึกษาเป็นตัวเลข"
								required
							/>
						</div>
						<div class="field password-field">
							<label for="password">รหัสผ่าน</label>
							<div class="password-wrapper">
								<input
									id="password"
									name="password"
									type="password"
									autocomplete="current-password"
									placeholder="•••••••"
									required
								/>
								<button
									id="toggle-password"
									class="eye-button"
									type="button"
									aria-label="แสดงรหัสผ่าน"
									aria-pressed="false"
									aria-controls="password"
								>
									<i data-lucide="eye" class="icon eye-open"></i>
									<i data-lucide="eye-off" class="icon eye-slash"></i>
								</button>
							</div>
						</div>
						<div class="forgot-row">
							<button type="button" class="text-button" data-demo="forgot">
								ลืมรหัสผ่าน?
							</button>
						</div>
						<button class="login-button" type="submit">
							เข้าสู่ระบบ
							<i data-lucide="arrow-right" class="icon"></i>
						</button>
					</form>

					<div class="divider"><span>or</span></div>
					<button
						id="kmutt-login"
						class="kmutt-button"
						type="button"
						data-demo="kmutt"
					>
						<i data-lucide="graduation-cap" class="icon"></i>
						Log in with KMUTT Account
					</button>
					<p class="signup">
						ยังไม่มีบัญชี?
						<a class="text-button" href="register.html">สมัครบัญชี</a>
					</p>
				</div>
			</section>
		</main>

		<!-- กล่องแจ้งสถานะการเข้าสู่ระบบ -->
		<dialog id="demo-dialog" aria-labelledby="dialog-title">
			<h2 id="dialog-title">เข้าสู่ระบบ</h2>
			<p id="dialog-message"></p>
			<form method="dialog"><button class="login-button">ปิด</button></form>
		</dialog>
	</body>
</html>
