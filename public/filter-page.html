<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ค้นหาและตัวกรอง | Internsight</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Prompt:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/filter.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/navbar.js" defer></script>
  <script src="js/components.js" defer></script>
</head>
<body>

<!-- Shared Top Navbar & Sidebar -->
<div id="app-navbar"></div>

<main>
  <div class="crumb">
    <svg class="solid pin"><use href="icons/icons.svg#i-pin"/></svg>หน้าหลัก <svg><use href="icons/icons.svg#i-arrow"/></svg> <svg><use href="icons/icons.svg#i-filter"/></svg> filter
  </div>

  <div class="layout">

    <aside class="left-bar">
      <h2><svg><use href="icons/icons.svg#i-filter"/></svg>ตัวกรองค้นหา</h2>
      <div class="grp">
        <h3>เรียงตาม</h3>
        <select class="sel" aria-label="เรียงตาม">
          <option>รีวิวล่าสุด</option>
          <option>รีวิวที่เก่าที่สุด</option>
          <option>รีวิวที่มียอดไลค์สูงสุด</option>
          <option>รีวิวที่มีคะแนนสูงสุด</option>
        </select>
      </div>

      <div class="grp">
        <h3>ค้นหาบริษัทและตำแหน่งงาน</h3>
        <label class="lbl" for="company">ชื่อบริษัท</label>
        <div class="field-icon"><svg><use href="icons/icons.svg#i-search"/></svg><input id="company" placeholder="พิมพ์ชื่อบริษัท เช่น AAAA, KB"></div>
        <div class="row2">
          <div><label class="lbl" for="ctype">ประเภทของบริษัท</label>
            <select class="sel" id="ctype">
              <option>ทั้งหมด</option>
              <option>Start-up</option>
              <option>Corporate</option>
              <option>ธนาคาร/การเงิน</option>
              <option>หน่วยงานรัฐ/รัฐวิสาหกิจ</option>
              <option>SME</option>
            </select></div>
          <div><label class="lbl" for="role">ตำแหน่งงาน</label>
            <select class="sel" id="role">
              <option>ทั้งหมด</option>
              <option>UX/UI</option>
              <option>Frontend Developer</option>
              <option>Backend Developer</option>
              <option>Full-stack Developer</option>
              <option>Data Analyst</option>
            </select></div>
        </div>
      </div>

      <div class="grp">
        <h3>รูปแบบการทำงาน</h3>
        <div class="pills">
          <label><input type="radio" name="mode" checked><span>ทั้งหมด</span></label>
          <label><input type="radio" name="mode"><span>On-site</span></label>
          <label><input type="radio" name="mode"><span>Remote</span></label>
          <label><input type="radio" name="mode"><span>Hybrid</span></label>
        </div>
      </div>

      <div class="grp">
        <h3>ค่าตอบแทนต่อวัน</h3>
        <div class="pills">
          <label><input type="radio" name="pay" checked><span>ทั้งหมด</span></label>
          <label><input type="radio" name="pay"><span>ไม่มีเบี้ยเลี้ยง</span></label>
          <label><input type="radio" name="pay"><span>300-500 ฿</span></label>
          <label><input type="radio" name="pay"><span>500-800 ฿</span></label>
          <label><input type="radio" name="pay"><span>800+ ฿</span></label>
        </div>
      </div>

      <div class="grp">
        <h3>ทักษะ</h3>
        <div class="field-icon"><svg><use href="icons/icons.svg#i-search"/></svg><input placeholder="พิมพ์ค้นหาทักษะ เช่น Python Java" aria-label="ทักษะ"></div>
        <div class="tags">
          <span class="tag">Figma <button type="button" aria-label="ลบ Figma"><svg><use href="icons/icons.svg#i-x"/></svg></button></span>
          <span class="tag">SQL <button type="button" aria-label="ลบ SQL"><svg><use href="icons/icons.svg#i-x"/></svg></button></span>
        </div>
      </div>

      <button class="btn-ui btn-ui-primary" style="width: 100%; margin-top: 6px;">นำตัวกรองไปใช้</button>
      <button class="btn-ui btn-ui-ghost" style="width: 100%; margin-top: 8px;">ล้างค่าตัวกรอง</button>
    </aside>


    <section class="right-bar">
      <!-- ใช้ .cards-grid และดึงการ์ดมาตรฐานเดียวกับหน้า Home จาก components.js -->
      <div class="cards-grid" id="filterCardsGrid"></div>

      <nav class="pager" aria-label="เลือกหน้า">
        <a class="nav" href="#" aria-disabled="true"><svg class="flip"><use href="icons/icons.svg#i-arrow"/></svg>ย้อนกลับ</a>
        <div class="nums">
          <a href="#" aria-current="page">1</a><a href="#">2</a><a href="#">3</a><span>…</span><a href="#">10</a>
        </div>
        <a class="nav" href="#">ถัดไป<svg><use href="icons/icons.svg#i-arrow"/></svg></a>
      </nav>
    </section>
  </div>
</main>

<a href="post-review.html" class="fab-write-review" title="เขียนรีวิวฝึกงาน" aria-label="เขียนรีวิว">
  <i data-lucide="pen-line"></i>
</a>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (window.InternsightUI) {
      window.InternsightUI.renderReviewCards("filterCardsGrid");
    }
  });
</script>
</body>
</html>
