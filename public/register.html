<!doctype html>
<html lang="th">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>สมัครสมาชิก | Internsight</title>
		<link rel="stylesheet" href="css/login.css">
		<link rel="stylesheet" href="css/register.css" />
		<script src="js/register.js" defer></script>
	</head>
	<body>
		<svg
			class="icon-definitions"
			xmlns="http://www.w3.org/2000/svg"
			aria-hidden="true"
		>
			<symbol id="logo" viewBox="0 0 32 32">
				<path d="M12 29H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h20a3 3 0 0 1 3 3v7" />
				<circle cx="18" cy="18" r="7" />
				<path d="m23 23 7 7" />
			</symbol>
			<symbol id="eye" viewBox="0 0 24 24">
				<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
				<circle cx="12" cy="12" r="3" />
			</symbol>
			<symbol id="cap" viewBox="0 0 28 28">
				<path d="m2 10 12-6 12 6-12 6Z M7 13v7c4 3 10 3 14 0v-7 M2 10v10" />
			</symbol>
			<symbol id="arrow" viewBox="0 0 24 24">
				<path d="M4 12h15m-6-6 6 6-6 6" />
			</symbol>
		</svg>
		<header class="site-header register-header">
			<a class="brand" href="index.html">
				<svg class="icon brand-icon"><use href="#logo" /></svg>
				<span>Internsight</span>
			</a>
			<a class="back-link" href="login.html" aria-label="กลับหน้าเข้าสู่ระบบ">
				<svg class="icon"><use href="#arrow" /></svg>
			</a>
		</header>
		<main class="register-layout">
			<section class="register-intro" aria-labelledby="intro-title">
				<h1 id="intro-title">
					ประสบการณ์จากรุ่นพี่
					<br />
					ถึงตาฝึกงานของเรา
				</h1>
				<p>ค้นหา บันทึก และแบ่งปันเรื่องราวฝึกงาน</p>
				<div class="register-board" aria-hidden="true">
					<div class="board-paper"></div>
					<div class="note register-note-one"><span></span></div>
					<div class="note register-note-two"><span></span></div>
					<div class="note register-note-three"><span></span></div>
				</div>
			</section>
			<section class="register-panel" aria-labelledby="register-title">
				<span class="register-tape" aria-hidden="true"></span>
				<h2 id="register-title">สมัครสมาชิก</h2>
				<p class="register-subtitle">สร้างบัญชีเพื่อเริ่มอ่านและเขียนรีวิว</p>
				<form id="register-form">
					<div class="field">
						<label for="student-id">รหัสนักศึกษา</label>
						<input
							id="student-id"
							name="studentId"
							type="text"
							inputmode="numeric"
							autocomplete="username"
							pattern="[0-9]+"
							title="กรอกรหัสนักศึกษาเป็นตัวเลข"
							placeholder="เช่น 67090500400"
							required
						/>
					</div>
					<div class="field">
						<label for="admission-year">ปีที่เข้าศึกษา (พ.ศ.)</label>
						<div class="select-wrapper">
							<select id="admission-year" name="admissionYear" required>
								<option value="" disabled selected>
									เลือกปีที่เข้าศึกษา
								</option>
							</select>
							<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
								<path d="m7 9 5 5 5-5" />
							</svg>
						</div>
					</div>
					<div class="field">
						<label for="email">อีเมล</label>
						<input
							id="email"
							name="email"
							type="email"
							autocomplete="email"
							placeholder="name@gmail.com"
							required
						/>
					</div>
					<div class="field">
						<label for="new-password">รหัสผ่าน</label>
						<div class="password-wrapper">
							<input
								id="new-password"
								name="password"
								type="password"
								autocomplete="new-password"
								placeholder="•••••••"
								required
							/>
							<button
								type="button"
								class="eye-button"
								data-password="new-password"
								aria-controls="new-password"
								aria-label="แสดงรหัสผ่าน"
								aria-pressed="false"
							>
								<svg class="icon">
									<use href="#eye" />
									<path class="eye-slash" d="m3 3 18 18" />
								</svg>
							</button>
						</div>
					</div>
					<div class="field">
						<label for="confirm-password">ยืนยันรหัสผ่าน</label>
						<div class="password-wrapper">
							<input
								id="confirm-password"
								name="confirmPassword"
								type="password"
								autocomplete="new-password"
								placeholder="•••••••"
								required
							/>
							<button
								type="button"
								class="eye-button"
								data-password="confirm-password"
								aria-controls="confirm-password"
								aria-label="แสดงรหัสผ่านที่ยืนยัน"
								aria-pressed="false"
							>
								<svg class="icon">
									<use href="#eye" />
									<path class="eye-slash" d="m3 3 18 18" />
								</svg>
							</button>
						</div>
					</div>
					<button class="login-button register-submit" type="submit">
						สมัครสมาชิก
						<svg class="icon"><use href="#arrow" /></svg>
					</button>
				</form>
				<div class="divider"><span>or</span></div>
				<button class="kmutt-button" type="button" id="register-kmutt">
					<svg class="icon"><use href="#cap" /></svg>
					Continue with KMUTT Account
				</button>
				<p class="signup">
					มีบัญชีแล้ว?
					<a class="text-button" href="index.html">เข้าสู่ระบบ</a>
				</p>
			</section>
		</main>
		<dialog id="register-dialog" aria-labelledby="dialog-title">
			<h2 id="dialog-title">ตัวอย่างการทำงาน</h2>
			<p id="dialog-message"></p>
			<form method="dialog"><button class="login-button">ปิด</button></form>
		</dialog>
	</body>
</html>
